tasks:
  # https://www.intel.com/content/www/us/en/support/articles/000090440/graphics.html
  # https://github.com/bcurran3/ChocolateyPackages/blob/main/intel-11th-14th-gen-processor-graphics/tools/ChocolateyInstall.ps1
