  # https://www.intel.com/content/www/us/en/download/776137/intel-7th-10th-gen-processor-graphics-windows.html
  # not tested yet
  - name: Stage pinned artifacts on the target
    ansible.windows.win_copy:
      src: "{{ local_cache }}/384.76-desktop-win10-64bit-GT710.exe"
      dest: "{{ remote_cache }}\\384.76-desktop-win10-64bit-GT710.exe"
    register: copy_nvidiagpudriver_result
  - name: Install NVIDIA driver (silent, no auto-reboot)
    ansible.windows.win_package:
      path: "{{ remote_cache }}\\384.76-desktop-win10-64bit-GT710.exe"
      arguments: "-s -n -clean"
      # 1 == success, reboot required:
      expected_return_code: [0, 1]
      # SFX spawns setup.exe as a child:
      wait_for_children: true
      # Optionally verify signature
      #verify_signature: true
    register: install_nvidiagpudriver_result
