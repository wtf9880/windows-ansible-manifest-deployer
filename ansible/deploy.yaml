---
- name: Deploy pinned Windows tools
  hosts: all
  gather_facts: false
  vars:
    local_cache: "{{ playbook_dir }}/../Cache"
    local_extract_dir: "{{ playbook_dir }}/../Cache/Extracted"
    local_done_dir: "{{ playbook_dir }}/../Cache/Done"
    remote_root: 'C:\ProgramData\manifest-deployer'
    remote_cache: '{{ remote_root }}\cache'
    remote_state: '{{ remote_root }}\state'
    manifest_paths: "{{ query('ansible.builtin.fileglob', playbook_dir + '/../manifests/*.yaml') }}"

  pre_tasks:
    - name: Ensure local extract directory exists on the controller
      ansible.builtin.file:
        path: "{{ local_extract_dir }}"
        state: directory
      delegate_to: localhost
      run_once: true
    - name: Ensure local done directory exists on the controller
      ansible.builtin.file:
        path: "{{ local_done_dir }}"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Load deployment manifests
      ansible.builtin.set_fact:
        app_manifests: >-
          {{ (app_manifests | default([])) +
             [(lookup('ansible.builtin.file', item) | from_yaml)] }}
      loop: "{{ manifest_paths }}"
      no_log: true

    - name: Ensure controller prepared all artifacts
      ansible.builtin.stat:
        path: "{{ local_cache }}/{{ item.cache_filename }}"
      loop: "{{ app_manifests }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      register: prepared_artifacts
      failed_when: not prepared_artifacts.stat.exists

    - name: Ensure remote working directories exist
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ remote_cache }}"
        - "{{ remote_state }}"

    #- name: Stage pinned artifacts on the target
