schema: 1
name: nodejs
cache_filename: node.zip
source:
  kind: github_release_template
  repo: nodejs/node
  tag_regex: '^v\d+\.\d+\.\d+$'
  include_prereleases: false
  url_template: 'https://nodejs.org/dist/{version}/node-{version}-win-x64.zip'
  checksum_url_template: 'https://nodejs.org/dist/{version}/SHASUMS256.txt'
  checksum_filename_template: 'node-{version}-win-x64.zip'
locked:
  version: v26.7.0
  url: https://nodejs.org/dist/v26.7.0/node-v26.7.0-win-x64.zip
  sha256: d3bd72755141ed32bbcd841228ee81897c8a98d50dfa7dae2179399a0a7c90f8
tasks:
  - name: Create directory if it does not exist
    ansible.windows.win_file:
      path: "C:\\Tools\\NodeJS"
      state: directory
  - name: Unzip the file to target device
    ansible.windows.win_unzip:
      src: "{{ local_cache }}/node.zip"
      dest: "C:\\Tools\\NodeJS"
  - name: Add NodeJS to PATH
    ansible.windows.win_path:
      elements:
        - "C:\\Tools\\NodeJS"
