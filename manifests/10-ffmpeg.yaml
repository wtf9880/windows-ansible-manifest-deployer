---
# https://github.com/BtbN/FFmpeg-Builds
# https://github.com/System233/ffmpeg-msvc-prebuilt
# https://ffmpeg.org/download.html
schema: 1
name: ffmpeg
enabled: true
source:
  - kind: github_release
    repo: System233/ffmpeg-msvc-prebuilt
    tag_regex: '^ffmpeg-\d+\.\d+\.\d+$'
    asset_regex: '^ffmpeg-\d+\.\d+\.\d+_x64-windows-shared-lgpl\.zip$'
    include_prereleases: false
    cache_filename: ffmpeg-latest-win64-shared-lgpl.zip
locked:
  - version: 'ffmpeg-9.0.2'
    url: https://github.com/System233/ffmpeg-msvc-prebuilt/releases/download/ffmpeg-9.0.2/ffmpeg-9.0.2_x64-windows-shared-lgpl.zip
    sha256: 545f841d982d7785790ba0fe86160ff45d77f37fc1c08cf7d3d33016c3307535
    cache_filename: ffmpeg-latest-win64-shared-lgpl.zip
tasks:
  - name: Create directory if it does not exist
    ansible.windows.win_file:
      path: "C:\\Tools\\FFMPEG"
      state: directory
  - name: Stage pinned artifacts on the target
    ansible.windows.win_copy:
      src: "{{ local_cache }}/ffmpeg-latest-win64-shared-lgpl.zip"
      dest: "{{ remote_cache }}\\ffmpeg-latest-win64-shared-lgpl.zip"
    register: copy_ffmpeg_zip_result
  - name: Unzip the file to target device
    when: copy_ffmpeg_zip_result.changed
    community.windows.win_unzip:
      src: "{{ remote_cache }}\\ffmpeg-latest-win64-shared-lgpl.zip"
      dest: "C:\\Tools\\FFMPEG"
  - name: Add to PATH
    ansible.windows.win_path:
      elements:
        - "C:\\Tools\\FFMPEG\\bin"
