schema: 1
name: openssl
source:
  - kind: github_release
    repo: TurboPack/OpenSSL-Distribution
    tag_regex: ^4\.\d+\.\d+$
    asset_regex: ^openssl-4\.\d+\.\d+-Windows-x64\.zip$
    include_prereleases: false
    cache_filename: openssl4-win64.zip
locked:
  - version: v4.0.1
    url: https://github.com/TurboPack/OpenSSL-Distribution/releases/download/v4.0.1/openssl-4.0.1-Windows-x64.zip
    sha256: b08aae3c38bf0711b9be7e99c7b1b9aeaf7a4c8aaae05f491d2f0a4bfc8be930
    cache_filename: openssl4-win64.zip
tasks:
  - name: Create directory if it does not exist
    ansible.windows.win_file:
      path: "C:\\Tools\\OpenSSL"
      state: directory
  - name: Stage pinned artifacts on the target
    ansible.windows.win_copy:
      src: "{{ local_cache }}/openssl4-win64.zip"
      dest: "{{ remote_cache }}\\openssl4-win64.zip"
    register: openssl_zip_copy_result
  - name: Unzip the file to target device
    community.windows.win_unzip:
      src: "{{ remote_cache }}/openssl4-win64.zip"
      dest: "C:\\Tools\\OpenSSL"
    when: openssl_zip_copy_result.changed
  - name: Add to PATH
    ansible.windows.win_path:
      elements:
        - "C:\\Tools\\OpenSSL"
