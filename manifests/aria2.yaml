schema: 1
name: aria2
cache_filename: aria2-win-64bit.zip
source:
  kind: github_release
  repo: aria2/aria2
  tag_regex: ^release-1\.\d+\.\d+$
  asset_regex: ^aria2-.*-win-64bit-build1\.zip$
  include_prereleases: false
locked:
  version: release-1.37.0
  url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip
  sha256: 67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288
tasks:
# https://github.com/ansible/ansible/blob/devel/lib/ansible/modules/unarchive.py
# https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/unarchive_module.html
- name: Ensure local extract cache directory exists on the controller
  ansible.builtin.file:
    path: "{{ local_extract_dir }}/aria2"
    state: directory
  delegate_to: localhost
  run_once: true
- name: Extract only the needed file, flattened
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/aria2-win-64bit.zip"
    dest: "{{ local_extract_dir }}/aria2"
    extra_opts:
      - "-j"
    include:
      - "aria2-*-win-64bit-build1/aria2c.exe"
    creates: "{{ local_extract_dir }}/aria2/aria2c.exe"
  delegate_to: localhost
#  register: unarchive_result
#- name: Show result
#  ansible.builtin.debug:
#    var: unarchive_result

- name: Create directory if it does not exist
  ansible.windows.win_file:
    path: C:\Tools\Aria2
    state: directory
- name: Add Aria2 to PATH
  ansible.windows.win_path:
    elements:
    - C:\Tools\Aria2

- name: Copy the extracted aria2c.exe file to the Windows target
  ansible.windows.win_copy:
    src: "{{ local_extract_dir }}/aria2/aria2c.exe"
    dest: C:\Tools\Aria2\aria2c.exe
