schema: 1
name: dufs
source:
  - kind: github_release
    repo: sigoden/dufs
    tag_regex: '^v0\.\d+\.\d+$'
    asset_regex: '^dufs-v\d+\.\d+\.\d+-x86_64-pc-windows-msvc\.zip$'
    include_prereleases: false
    cache_filename: dufs-latest-x86_64-pc-windows-msvc.zip
locked:
  - version: v0.46.0
    url: https://github.com/sigoden/dufs/releases/download/v0.46.0/dufs-v0.46.0-x86_64-pc-windows-msvc.zip
    sha256: 21d829653ac1f178b124ed384e2a57df19b99ae404935cba9a1a5719c199b0bf
    cache_filename: dufs-latest-x86_64-pc-windows-msvc.zip
tasks:
  - name: Create directory if it does not exist
    ansible.windows.win_file:
      path: "C:\\Tools\\Dufs"
      state: directory
  - name: Stage pinned artifacts on the target
    ansible.windows.win_copy:
      src: "{{ local_cache }}/dufs-latest-x86_64-pc-windows-msvc.zip"
      dest: "{{ remote_cache }}\\dufs-latest-x86_64-pc-windows-msvc.zip"
    register: copy_dufs_zip_result
  - name: Unzip the file to target device
    community.windows.win_unzip:
      src: "{{ remote_cache }}\\dufs-latest-x86_64-pc-windows-msvc.zip"
      dest: "C:\\Tools\\Dufs"
    when: copy_dufs_zip_result.changed
  - name: Add to PATH
    ansible.windows.win_path:
      elements:
        - "C:\\Tools\\Dufs"
