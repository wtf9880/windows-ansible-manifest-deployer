    #    loop_control:
    #      loop_var: manifest_file

    - name: Check which manifests/apps are already configured/installed
      ansible.builtin.find:
        paths: "{{ local_done_dir }}"
        patterns: "*.lock"
      register: done_files
      delegate_to: localhost
      run_once: true
    - name: Install each app
      ansible.builtin.include_tasks: tasks/_install_from_manifest.yaml
      loop: "{{ app_manifests }}"
      loop_control:
        loop_var: manifest
      when: (manifest.name + ".lock") not in done_files.files | map(attribute='path') | map('basename') | list


