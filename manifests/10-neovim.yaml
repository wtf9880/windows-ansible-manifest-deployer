schema: 1
name: neovim
source:
  - kind: github_release
    repo: neovim/neovim
    tag_regex: '^v0\.12\.\d+$'
    asset_regex: '^nvim-win64\.zip$'
    include_prereleases: false
    cache_filename: nvim-win64.zip
locked:
  - version: v0.12.4
    url: https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-win64.zip
    sha256: 9fc3572829ffd13debb6e32555da2c8cc02555568260a9fc4cf1f65bbcca319c
    cache_filename: nvim-win64.zip
tasks:
  - name: Create directory if it does not exist
    ansible.windows.win_file:
      path: "C:\\Tools\\Neovim"
      state: directory
  - name: Stage pinned artifacts on the target
    ansible.windows.win_copy:
      src: "{{ local_cache }}/nvim-win64.zip"
      dest: "{{ remote_cache }}\\nvim-win64.zip"
  - name: Unzip the file to target device
    community.windows.win_unzip:
      src: "{{ remote_cache }}/nvim-win64.zip"
      dest: "C:\\Tools\\Neovim"
  - name: Strip extraction subdirectory
    ansible.windows.win_shell:
      cmd: |
        Move-Item -Path "C:\\Tools\\Neovim\\nvim-win64\\*" -Destination "C:\\Tools\\Neovim\\" -Force
        Remove-Item -Path "C:\\Tools\\Neovim\\nvim-win64" -Force -Recurse
      removes: "C:\\Tools\\Neovim\\nvim-win64"
      creates: "C:\\Tools\\Neovim\\bin\\nvim.exe"
  #- name: Move contents to parent directory (stage 1, copying)
  #  ansible.windows.win_copy:
  #    src: "C:\\Tools\\Neovim\\nvim-win64\\"
  #    dest: "C:\\Tools\\Neovim\\"
  #    remote_src: yes
  #- name: Move contents to parent directory (stage 2, removing redundant dir)
  #  ansible.windows.win_file:
  #    path: "C:\\Tools\\Neovim\\nvim-win64"
  #    state: absent
  - name: Add to PATH
    ansible.windows.win_path:
      elements:
        - "C:\\Tools\\Neovim\\bin"
